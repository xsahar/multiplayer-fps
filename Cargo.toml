[package]
name = "maze-wars"
version = "0.1.0"
edition = "2021"

[lib]
name = "maze_wars"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
anyhow = "1.0.103"
bincode = "1.3.3"
crossbeam-channel = "0.5.15"
macroquad = "0.4.15"
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0.69"
